# FTDI FT232H as a JTAG interface
#
# Copied from interface/ftdi/um232h.cfg distributed with OpenOCD.
#
# Should work with any generic FT232H breakout board that exposes the listed pins.
#
# Tested with:
#
# https://www.adafruit.com/product/2264
#
# Ref: https://openocd.org/doc/html/Debug-Adapter-Configuration.html
# Ref: https://ftdichip.com/wp-content/uploads/2020/07/DS_FT232H.pdf
#
# Pinout:
# Adafruit  FT232H    JTAG
# Pin Name  Pin Name  Func
# D0        ADBUS0    TCK
# D1        ADBUS1    TDI
# D2        ADBUS2    TDO
# D3        ADBUS3    TMS
# C0        ACBUS0    nTRST
# C1        ACBUS1    nSRST

adapter driver ftdi

# Vendor ID and Product ID for FT232H
ftdi vid_pid 0x0403 0x6014

# Initial values and directions for all 16 pins
# Set unused pins to output to avoid floating inputs
#                       CCCC CCCC DDDD DDDD
#                       7654 3210 7654 3210
# Initial value: 0xfff8=1111 1111 1111 1000
# Direction:     0xfffb=1111 1111 1111 1011 (0=input, 1=output)
ftdi layout_init 0xfff8 0xfffb

# Set C0=nTRST and C1=nSRST and set them up as unbuffered.
#
# TCK, TDI, TDO, and TMS signals pins are fixed by FT232H design, the nTRST and
# nSRST signals can be on any available pins.
#
# From https://openocd.org/doc/html/Debug-Adapter-Configuration.html
# "A special case is provided when -data and -oe is set to the same bitmask.
# Then the FTDI pin is considered being connected straight to the target
# without any buffer. The FTDI pin is then switched between output and input as
# necessary to provide the full set of low, high and Hi-Z characteristics. In
# all other cases, the pins specified in a signal definition are always driven
# by the FTDI."

#                       CCCC CCCC DDDD DDDD
#                       7654 3210 7654 3210
# Data:          0x0100=0000 0001 0000 0000
# Output Enable: 0x0100=0000 0001 0000 0000
ftdi layout_signal nTRST -data 0x0100 -oe 0x0100

#                       CCCC CCCC DDDD DDDD
#                       7654 3210 7654 3210
# Data:          0x0200=0000 0010 0000 0000
# Output Enable: 0x0200=0000 0010 0000 0000
ftdi layout_signal nSRST -data 0x0200 -oe 0x0200
